<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRANAV — Short Key Panel</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(1200px 600px at 50% -10%, #2A1545 0%, #0F0620 60%) fixed, #0F0620; color: #EDE7F6; font-family: 'Segoe UI', Arial, sans-serif; padding: 16px; min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; padding: 30px 12px; border-radius: 18px; margin-bottom: 18px; background: linear-gradient(160deg, #241040 0%, #160A2C 100%); border: 1px solid #5A3A9A; box-shadow: 0 12px 0 #0A0414, 0 20px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12); }
  header h1 { color: #FFD700; font-size: 34px; letter-spacing: 4px; font-weight: 900; text-shadow: 0 2px 0 #B37A00, 0 4px 0 #7A5200, 0 6px 0 #4A3200, 0 10px 18px rgba(0,0,0,.7); }
  header p { color: #B388FF; font-size: 13px; margin-top: 10px; letter-spacing: 1px; }
  .warn { background: linear-gradient(180deg, #4A1500, #2A0D00); border: 1px solid #FF6D00; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: #FFB74D; box-shadow: 0 5px 0 #0A0414; }
  .card { background: linear-gradient(170deg, #1E0E38 0%, #150A28 100%); border: 1px solid #4A2B7A; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 8px 0 #0A0414, 0 14px 28px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
  .card h2 { color: #FFD700; font-size: 17px; margin-bottom: 12px; text-shadow: 0 2px 0 #4A3200; }
  label { display: block; font-size: 13px; color: #B388FF; margin: 10px 0 4px; font-weight: 600; }
  input[type=text], input[type=number] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #4A2B7A; background: #241240; color: #fff; font-size: 15px; box-shadow: inset 0 3px 6px rgba(0,0,0,.5); }
  input:focus { outline: none; border-color: #FFD700; box-shadow: inset 0 3px 6px rgba(0,0,0,.5), 0 0 10px rgba(255,215,0,.35); }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  .btn3d { display: inline-block; border: none; cursor: pointer; font-weight: 900; font-size: 16px; letter-spacing: 1px; color: #3A2400; padding: 14px 28px; border-radius: 12px; margin-top: 14px; background: linear-gradient(180deg, #FFE082 0%, #FFD700 45%, #FFB300 100%); box-shadow: 0 6px 0 #B37A00, 0 10px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.5); }
  .btn3d.purple { color: #fff; background: linear-gradient(180deg, #B388FF 0%, #7B1FA2 55%, #5A1080 100%); box-shadow: 0 6px 0 #3A0A5A, 0 10px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.35); }
  .btn3d.small { padding: 8px 14px; font-size: 13px; margin-top: 0; border-radius: 9px; }
  .btn3d.red.small { color: #fff; background: linear-gradient(180deg, #FF6B6B 0%, #D32F2F 55%, #9A0007 100%); }
  .keybox { background: #0A0414; border: 2px dashed #00F0FF; border-radius: 10px; padding: 16px; word-break: break-all; font-family: monospace; font-size: 19px; color: #00F0FF; margin-top: 14px; text-align: center; letter-spacing: 2px; }
  .preview { margin-top: 10px; font-size: 13px; color: #B388FF; } .preview b { color: #FFD700; }
  .ok { color: #69F0AE; font-weight: bold; } .bad { color: #FF5252; font-weight: bold; }
  .stats { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; text-align: center; padding: 14px 6px; border-radius: 12px; background: linear-gradient(180deg, #2A1545, #1A0B2E); border: 1px solid #4A2B7A; }
  .stat .n { font-size: 26px; font-weight: 900; color: #FFD700; }
  .stat .t { font-size: 11px; color: #B388FF; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { padding: 9px 6px; border-bottom: 1px solid #2A1545; text-align: left; }
  th { color: #FFD700; font-size: 11px; }
  .mono { font-family: monospace; word-break: break-all; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 900; }
  .badge.on { background: #1B5E20; color: #A5FFB8; }
  .badge.off { background: #5D1A1A; color: #FF9A9A; }
  .hint { font-size: 12px; color: #8A7AA8; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
<header><h1>⚡ PRANAV</h1><p>SHORT KEY PANEL • DAYS + HOURS + MINUTES + LIFETIME + REVOKE</p></header>
<div class="card"><h2>🔑 Generate Key</h2>
<label>Device ID *</label><input type="text" id="devid" placeholder="Device ID">
<div class="row">
<div><label>Days</label><input type="number" id="days" value="30" min="0" oninput="updPreview()"></div>
<div><label>Hours</label><input type="number" id="hours" value="0" min="0" max="23" oninput="updPreview()"></div>
<div><label>Minutes</label><input type="number" id="minutes" value="0" min="0" max="59" oninput="updPreview()"></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
<label style="display:flex;align-items:center;gap:8px;color:#FFD700;background:#241240;border:1px solid #4A2B7A;padding:8px 12px;border-radius:8px;font-size:12px"><input type="checkbox" id="lifetime" onchange="toggleLifetime()"> ♾️ LIFETIME</label>
<button class="btn3d purple small" onclick="setQuick(1)">1 Day</button>
<button class="btn3d purple small" onclick="setQuick(7)">7 Days</button>
<button class="btn3d purple small" onclick="setQuick(0,0,30)">30 Min</button>
</div>
<div class="preview">⏰ Expires: <b id="expPreview">—</b></div>
<button class="btn3d" onclick="genKey()">⚡ GENERATE KEY</button>
<div id="out" style="display:none"><div class="keybox" id="keyout"></div><button class="btn3d purple small" onclick="copyKey()">📋 COPY</button></div>
</div>
</div>
<script>
// Full JS same as file - secret embedded
const te=new TextEncoder();let LASTKEY='';const _E="NGw9aDgeCRQfLAsJHjk8IjFuEBxiCAAzLA8vEjdjbQ0=";const SECRET=atob(_E).split('').map(c=>String.fromCharCode(c.charCodeAt(0)^0x5A)).join('');
const B32A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(b){const a=new Uint8Array(b);let s='',buf=0,bits=0;for(let i=0;i<a.length;i++){buf=(buf<<8)|a[i];bits+=8;while(bits>=5){bits-=5;s+=B32A[(buf>>>bits)&31];}}if(bits>0)s+=B32A[(buf<<(5-bits))&31];return s;}
function b32_4(v){let s='';for(let i=0;i<4;i++){s=B32A[v&31]+s;v>>>=5;}return s;}
async function shortSig(dev,custom,expH){const k=await crypto.subtle.importKey('raw',te.encode(SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);const input=custom?(dev+'#'+custom+'#'+expH):(dev+'#'+expH);const sig=await crypto.subtle.sign('HMAC',k,te.encode(input));return b32enc(sig).slice(0,8);}
function ist(ts){return new Date(ts).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});}
function toggleLifetime(){const l=document.getElementById('lifetime').checked;document.getElementById('days').disabled=l;document.getElementById('hours').disabled=l;document.getElementById('minutes').disabled=l;updPreview();}
function setQuick(d,h,m){document.getElementById('lifetime').checked=false;toggleLifetime();if(arguments.length===1){document.getElementById('days').value=d;document.getElementById('hours').value=0;document.getElementById('minutes').value=0;}else{document.getElementById('days').value=d||0;document.getElementById('hours').value=h||0;document.getElementById('minutes').value=m||0;}updPreview();}
function updPreview(){const l=document.getElementById('lifetime')?.checked;if(l){document.getElementById('expPreview').textContent='♾️ LIFETIME - '+ist(Date.now()+3650*86400*1000);return;}const d=Math.max(0,+document.getElementById('days').value||0);const h=Math.max(0,+document.getElementById('hours').value||0);const mi=Math.max(0,+document.getElementById('minutes').value||0);document.getElementById('expPreview').textContent=ist(Date.now()+(d*86400+h*3600+mi*60)*1000);}
async function genKey(){const dev=document.getElementById('devid').value.trim();if(!dev){alert('Device ID dalo');return;}const isLife=document.getElementById('lifetime').checked;let d=Math.max(0,+document.getElementById('days').value||0);let h=Math.max(0,+document.getElementById('hours').value||0);let mi=Math.max(0,+document.getElementById('minutes').value||0);if(isLife){d=3650;h=0;mi=0;}const expH=Math.floor((Date.now()+(d*86400+h*3600+mi*60)*1000)/3600000);const key='PRANAV-'+b32_4(expH)+'-'+await shortSig(dev,'',expH);LASTKEY=key;document.getElementById('keyout').textContent=key;document.getElementById('out').style.display='block';}
function copyKey(){navigator.clipboard.writeText(LASTKEY).then(()=>alert('Copied ✅'));}
window.addEventListener('load',()=>{updPreview();});
</script>
</body>
</html>
